services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: polar-api
    container_name: polar_api
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      APP_SERVICE: app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "8092:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "api.polar.localhost:host-gateway"
    networks:
      - polar_network
      - appnet

networks:
  polar_network:
    driver: bridge
  appnet:
    external: true
